<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آيلوجيا للاختبارات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#005542;--iv:#FBF9F5;--au:#D4AF37;--tx:#1d2b26;--bd:#e4ded2}
*{box-sizing:border-box}body{margin:0;background:var(--iv);color:var(--tx);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.7}
header{background:var(--g);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--au)}
header b{font-size:1.2rem}main{max-width:900px;margin:20px auto;padding:0 16px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px;margin:12px 0}.c{text-align:center}
.m{color:#6b756f;font-size:.9rem;margin:6px 0}h2{color:var(--g)}h3{margin:.3em 0}
.b{background:var(--g);color:#fff;border:0;border-radius:10px;padding:9px 18px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.b:disabled{opacity:.4}.b.s{background:#fff;color:var(--g);border:1px solid var(--g)}header .b{background:var(--au);color:#000;padding:5px 12px}
.o{display:block;border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin:8px 0;cursor:pointer}.o.on{border-color:var(--g);background:#eef6f3}
.o.ok{border-color:#1a8754;background:#e6f5ec}.o.no{border-color:#c0392b;background:#fbeaea}
.row{display:flex;justify-content:space-between;margin-top:14px}.bar{display:flex;justify-content:space-between;position:sticky;top:0;background:var(--iv);padding:8px 0;font-size:1.1rem}
#tm{color:var(--g);font-weight:700;font-variant-numeric:tabular-nums}.big{font-size:3rem;font-weight:700}.big.ok{color:#1a8754}.big.no{color:#c0392b}
</style></head><body>
<header><b>آيلوجيا للاختبارات</b><button class="b" id="out" hidden>تسجيل الخروج</button></header>
<main id="app">جارٍ التحميل…</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const U='https://zugwicbbfbefbbwugfxq.supabase.co',K='sb_publishable_34jNpaqwtFeYboTVgO-mYw_efc0T-Ew';
const sb=supabase.createClient(U,K),A=document.getElementById('app'),O=document.getElementById('out');let tick;
const h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg=t=>A.innerHTML=`<div class="card c">${t}</div>`,$=s=>A.querySelector(s);
O.onclick=()=>sb.auth.signOut();
async function go(){clearInterval(tick);const{data:{session}}=await sb.auth.getSession();O.hidden=!session;if(!session)return login();
 const[p,id]=location.hash.slice(1).split('/');
 try{p==='exam'?await room(+id):p==='result'?await result(+id):await home()}catch(e){msg('حدث خطأ: '+h(e.message))}}
function login(){A.innerHTML='<div class="card c"><h2>سجّل الدخول للبدء</h2><button class="b">الدخول بحساب Google</button></div>';
 $('button').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}})}
async function home(){
 const[a,b,c]=await Promise.all([sb.from('exam_subjects').select('*').order('sort_order'),sb.from('exam_exams').select('*').eq('status','published').order('id'),sb.from('exam_attempts').select('exam_id,percentage').neq('status','in_progress')]);
 if(a.error||b.error)throw(a.error||b.error);if(!a.data.length)return msg('لا توجد اختبارات بعد — شغّل schema.sql في Supabase.');
 const best={};(c.data||[]).forEach(t=>best[t.exam_id]=Math.max(best[t.exam_id]??0,t.percentage??0));
 A.innerHTML=a.data.map(u=>`<h2>${h(u.name_ar)}</h2><div class="g">${b.data.filter(e=>e.subject_id==u.id).map(e=>`<div class="card"><h3>${h(e.title)}</h3><p>${h(e.description)}</p><p class="m">⏱ ${e.duration_minutes} دقيقة · النجاح ${e.passing_score}%${e.id in best?` · أفضل نتيجة ${best[e.id]}%`:''}</p><button class="b" data-e="${e.id}">ابدأ الاختبار</button></div>`).join('')}</div>`).join('');
 A.querySelectorAll('[data-e]').forEach(x=>x.onclick=async()=>{x.disabled=true;const{data,error}=await sb.rpc('exam_start',{p_exam:+x.dataset.e});
  if(error){alert(error.message.includes('max')?'استنفدت عدد المحاولات':error.message);x.disabled=false;return}location.hash='exam/'+data})}
async function room(id){
 const{data:d,error}=await sb.rpc('exam_load',{p_attempt:id});if(error)throw error;if(d.status!=='in_progress'){location.hash='result/'+id;return}
 const off=Date.now()-d.now,ans=d.ans;let i=0,done=false;
 const left=()=>Math.max(0,Math.round((d.deadline+off-Date.now())/1000));
 const fin=async()=>{if(done)return;done=true;clearInterval(tick);await sb.rpc('exam_submit',{p_attempt:id});location.hash='result/'+id};
 const t=()=>{const s=left(),el=$('#tm');if(el)el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s)fin()};
 const draw=()=>{const q=d.qs[i],last=i==d.qs.length-1;
  A.innerHTML=`<div class="bar"><b>${h(d.title)}</b><span id="tm"></span></div><div class="card"><p class="m">سؤال ${i+1} من ${d.qs.length}</p><h3>${h(q.t)}</h3>${q.o.map((o,k)=>`<label class="o${ans[q.id]===k?' on':''}"><input type="radio" name="r" value="${k}" ${ans[q.id]===k?'checked':''}> ${h(o)}</label>`).join('')}<div class="row"><button class="b s" id="pv" ${i?'':'disabled'}>السابق</button><button class="b" id="nx">${last?'تسليم الاختبار':'التالي'}</button></div></div>`;
  A.querySelectorAll('input').forEach(r=>r.onchange=async()=>{ans[q.id]=+r.value;draw();const{error}=await sb.rpc('exam_save',{p_attempt:id,p_q:q.id,p_choice:+r.value});if(error)alert('تعذّر حفظ الإجابة: '+error.message)});
  $('#pv').onclick=()=>{i--;draw()};$('#nx').onclick=()=>{if(!last){i++;draw()}else if(confirm('تأكيد تسليم الاختبار؟'))fin()};t()};
 draw();tick=setInterval(t,1000)}
async function result(id){
 const{data:d,error}=await sb.rpc('exam_review',{p_attempt:id});if(error)throw error;
 A.innerHTML=`<div class="card c"><h2>${h(d.title)}</h2><div class="big ${d.passed?'ok':'no'}">${d.pct}%</div><p>${d.score} من ${d.max} — ${d.passed?'ناجح ✅':'لم تجتز الاختبار'}</p><a class="b" href="#">العودة للاختبارات</a></div>`+
 d.qs.map((q,n)=>`<div class="card"><p class="m">سؤال ${n+1}</p><h3>${h(q.t)}</h3>${q.o.map((o,k)=>`<div class="o ${k===q.c?'ok':k===q.a?'no':''}">${h(o)}${k===q.c?' ✔':k===q.a?' ✘ (إجابتك)':''}</div>`).join('')}<p class="m">${h(q.x)}</p></div>`).join('')}
sb.auth.onAuthStateChange(()=>go());addEventListener('hashchange',go);go();
</script></body></html>
