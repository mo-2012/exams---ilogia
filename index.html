 function field(label,value){return `<div class="account-field"><small>${label}</small><strong>${h(value||'غير مسجل')}</strong></div>`}
 async function profilePage(){const p=account.profile||{},pub=account.publicProfile||{},user=account.user,name=p.full_name||pub.full_name||user.user_metadata?.full_name||'حساب آيلوجيا',avatar=pub.avatar_url||p.avatar_url||user.user_metadata?.avatar_url,role=p.is_teacher?'معلم':p.role==='admin'||p.is_platform_admin?'مسؤول':'طالب',created=p.created_at?new Date(p.created_at).toLocaleDateString('ar-EG'):'غير مسجل',onboarded=p.onboarded_at?new Date(p.onboarded_at).toLocaleDateString('ar-EG'):'غير مكتمل';A.innerHTML=`<section class="section-head"><div><span class="eyebrow">حسابك</span><h1 class="page-title">الملف الشخصي</h1><p class="page-intro">بيانات حسابك المحفوظة في قاعدة بيانات آيلوجيا.</p></div></section><article class="card"><div class="profile-banner">${avatar?`<img class="user-avatar" src="${h(avatar)}" alt="" referrerpolicy="no-referrer">`:'<span class="user-avatar">◎</span>'}<div class="profile-banner-copy"><h2>${h(name)}</h2><p>${h(p.email||user.email||'')}</p></div><span class="pill">${role}</span></div><div class="account-grid">${field('الاسم الكامل',p.full_name||pub.full_name||user.user_metadata?.full_name)}${field('البريد الإلكتروني',p.email||user.email)}${field('رقم الهاتف',p.phone)}${field('رقم الطالب',p.student_id)}${field('الصف الدراسي',p.grade_level)}${field('معرّف الصف',p.grade_id)}${field('المحافظة',p.governorate)}${field('نوع الحساب',role)}${field('حالة الحساب',p.is_active===false?'غير نشط':'نشط')}${field('تاريخ إنشاء الحساب',created)}${field('إكمال بيانات الحساب',onboarded)}${field('معرّف الحساب',p.id||user.id)}</div>${!account.profile?'<p class="auth-message" style="margin-top:16px">لم يُنشأ سجل ملف شخصي لهذا الحساب بعد؛ المعروض حاليًا هو بيانات الدخول.</p>':''}</article>`}
 async function historyPage(){const[attempts,exams]=await Promise.all([loadAttempts(),loadExams()]),examNames=new Map(exams.map(e=>[e.id,e.title]));if(!attempts.length){A.innerHTML='<section class="section-head"><div><span class="eyebrow">نتائجك</span><h1 class="page-title">النتائج وسجل المحاولات</h1><p class="page-intro">ستجد هنا محاولاتك ودرجاتك بعد بدء أول امتحان.</p></div></section><div class="card empty-inline">لا توجد محاولات مسجلة على حسابك حتى الآن.</div>';return}A.innerHTML=`<section class="section-head"><div><span class="eyebrow">نتائجك</span><h1 class="page-title">النتائج وسجل المحاولات</h1><p class="page-intro">تابع حالة كل محاولة وارجع إلى نتائجك السابقة.</p></div><span class="section-count"><strong>${attempts.length}</strong> محاولة</span></section><div class="g">${attempts.map(a=>{const done=!!a.finished_at;return `<article class="card"><div class="history-row"><div><h3>${h(examNames.get(a.exam_id)||'امتحان')}</h3><p class="m">${done?'مكتمل':'قيد التنفيذ'} · ${a.started_at?new Date(a.started_at).toLocaleDateString('ar-EG'):''}</p></div>${done?`<span class="history-score">${h(a.score)} درجة</span>`:''}</div><button class="b s" style="margin-top:15px" data-attempt="${a.id}" data-finished="${done}">${done?'عرض النتيجة':'متابعة الامتحان'}</button></article>`}).join('')}</div>`;A.querySelectorAll('[data-attempt]').forEach(button=>button.onclick=()=>{location.hash=(button.dataset.finished==='true'?'result/':'exam/')+button.dataset.attempt})}
async function room(id){
 const{data:d,error}=await sb.rpc('exams_get_attempt',{p_attempt_id:id});if(error)throw error;if(d.status!=='in_progress'){location.hash='result/'+id;return}
 const off=Date.now()-d.now,ans=d.answers;let i=0,done=false,submitting=false,saveQueue=Promise.resolve(),saveState='تم حفظ الإجابات';const failedSaves=new Map();
 const questions=d.questions,optionText=o=>typeof o==='string'?o:(o?.text??o?.label??o?.value??'');
 const left=()=>Math.max(0,Math.round((d.deadline+off-Date.now())/1000));
 const setSaveState=(text,error=false,retry=false)=>{saveState=text;const el=$('#save-state');if(el){el.textContent=text;el.classList.toggle('error',error);if(retry){const button=document.createElement('button');button.className='b s';button.type='button';button.textContent='إعادة حفظ الإجابات';button.onclick=retryFailedSaves;el.append(' ',button)}}};
 const retryFailedSaves=()=>{for(const[questionId,choice]of [...failedSaves])saveAnswer(questionId,choice)};
 const saveAnswer=(questionId,choice)=>{
  setSaveState('جارٍ حفظ الإجابة…');
  const current=saveQueue.catch(()=>{}).then(async()=>{const{error}=await sb.rpc('exams_save_answer',{p_attempt_id:id,p_question_id:questionId,p_choice:choice});if(error)throw error});
  saveQueue=current;
  void current.then(()=>{if(ans[questionId]===choice)failedSaves.delete(questionId);if(saveQueue===current)setSaveState(failedSaves.size?'تعذّر حفظ إجابة':'تم حفظ الإجابات',failedSaves.size>0,failedSaves.size>0)}).catch(()=>{if(ans[questionId]===choice)failedSaves.set(questionId,choice);if(saveQueue===current)setSaveState('تعذّر حفظ الإجابة',true,failedSaves.size>0)});
  return current
 };
 const fin=async()=>{
  if(done||submitting)return;submitting=true;const button=$('#nx');if(button)button.disabled=true;setSaveState('جارٍ حفظ الإجابات وتسليم الاختبار…');
  try{await saveQueue.catch(()=>{});if(failedSaves.size)throw new Error('توجد إجابة لم تُحفظ. ارجع للسؤال وأعد اختيار الإجابة قبل التسليم.');const{error}=await sb.rpc('exams_submit_attempt',{p_attempt_id:id});if(error)throw error;done=true;clearInterval(tick);location.hash='result/'+id}
  catch(e){submitting=false;setSaveState('تعذّر التسليم: '+e.message,true,failedSaves.size>0);if(button)button.disabled=false}
 };
 const t=()=>{const s=left(),el=$('#tm');if(el)el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s){clearInterval(tick);fin()}};
 const draw=()=>{const q=questions[i],last=i===questions.length-1,progress=questions.length?Math.round((i+1)/questions.length*100):0;
  A.innerHTML=`<section class="exam-shell"><div class="exam-top"><span class="exam-name">${h(d.title)}</span><span class="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9 2h6m-3 0v3"/></svg><span id="tm"></span></span></div><div class="exam-progress" role="progressbar" aria-label="تقدم الاختبار" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100"><span style="width:${progress}%"></span></div><article class="card question-card"><p id="save-state">${h(saveState)}</p><div class="question-heading"><span class="question-index">السؤال ${i+1} من ${questions.length}</span><span class="question-tag">${last?'السؤال الأخير':'اختر إجابة واحدة'}</span></div><h2 class="question-title">${h(q.text)}</h2><div class="answer-list">${q.options.map((o,k)=>`<label class="o${ans[q.id]===k?' on':''}"><input type="radio" name="r" value="${k}" ${ans[q.id]===k?'checked':''}><span>${h(optionText(o))}</span></label>`).join('')}</div><div class="question-actions"><button class="b s" id="pv" ${i?'':'disabled'}><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>السابق</button><button class="b" id="nx">${last?'تسليم الاختبار':'السؤال التالي'}<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg></button></div></article></section>`;
  A.querySelectorAll('input').forEach(r=>r.onchange=()=>{ans[q.id]=+r.value;draw();saveAnswer(q.id,+r.value)});
  $('#pv').onclick=()=>{i--;draw()};$('#nx').onclick=()=>{if(!last){i++;draw()}else if(confirm('تأكيد تسليم الاختبار؟'))fin()};t()};
 draw();tick=setInterval(t,1000)}
async function result(id){
 const{data:d,error}=await sb.rpc('exams_get_result',{p_attempt_id:id});if(error)throw error;
 const pct=d.max?Math.round(d.score/d.max*100):0;
 A.innerHTML=`<section class="exam-shell"><div class="card result-card"><div class="result-head"><span class="result-seal" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m8 12 2.5 2.5L16.5 8.5"/><circle cx="12" cy="12" r="9"/></svg></span><h1>${h(d.title)}</h1><div class="result-score">${pct}%</div><p class="result-subtitle">درجتك ${d.score} من ${d.max}</p></div><div class="result-footer"><a class="b" href="#">العودة للاختبارات <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg></a></div></div><h2 class="review-title">مراجعة الإجابات</h2>${d.questions.map((q,n)=>`<article class="card review-card"><div class="question-heading"><span class="question-index">السؤال ${n+1}</span><span class="question-tag">${q.answer===q.correct?'إجابة صحيحة':'مراجعة الإجابة'}</span></div><h3>${h(q.text)}</h3><div class="answer-list">${q.options.map((o,k)=>`<div class="o ${k===q.correct?'ok':k===q.answer?'no':''}"><span>${h(typeof o==='string'?o:(o?.text??o?.label??o?.value??''))}</span><strong>${k===q.correct?'✓':k===q.answer?'إجابتك':''}</strong></div>`).join('')}</div>${q.explanation?`<p class="m">${h(q.explanation)}</p>`:''}</article>`).join('')}</section>`}
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){currentUser=null;account=null;recoveryMode=false}if(event==='PASSWORD_RECOVERY')recoveryMode=true;if(session?.user&&currentUser?.id!==session.user.id){currentUser=session.user;account=null}setTimeout(()=>go(),0)});addEventListener('hashchange',go);go();
</script></body></html>
